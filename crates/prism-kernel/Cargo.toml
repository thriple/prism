[package]
name = "prism-kernel"
description = "The NURBS kernel behind Prism's Kernel trait (arris)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
prism-math.workspace = true
prism-geom.workspace = true
# The kernel picked by the NURBS Spike (DECISIONS #9). Pre-1.0: pinned, and
# used only in this crate.
arris-geom = { version = "=0.10.0", default-features = false }
arris-math = { version = "=0.10.0", default-features = false }
# Solids (Fillet Joins step A): topology, the builder and the operations.
arris-topo = { version = "=0.10.0", default-features = false }
arris-ops = { version = "=0.10.0", default-features = false }
# STEP AP214 in and out (Solids & CAD part 5, brief 44).
arris-io = { version = "=0.10.0", default-features = false }
arris-check = { version = "=0.10.0", default-features = false }
