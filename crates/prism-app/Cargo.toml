[package]
name = "prism-app"
description = "Prism's window and event shell (winit, wgpu, egui overlay)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
winit.workspace = true
wgpu.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-winit.workspace = true
log.workspace = true
prism-ui.workspace = true
prism-math.workspace = true
prism-geom.workspace = true
prism-topo.workspace = true
prism-ops.workspace = true
prism-doc.workspace = true
prism-render.workspace = true
prism-view.workspace = true
prism-infer.workspace = true
prism-tools.workspace = true
prism-file.workspace = true
web-time = "1.1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json.workspace = true
zip.workspace = true
flate2.workspace = true
sha2 = "0.10"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
env_logger = "0.11.11"
pollster = "1.0.1"
# Open and save dialogs. On Linux (CI) the xdg-portal backend is pure Rust.
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
tiny_http = { version = "0.12", default-features = false }
ureq = { version = "3.5", default-features = false, features = ["native-tls-no-default"] }

# One running Prism: later starts hand their files over (brief 11).
# "0BSD OR Apache-2.0": we use it under Apache-2.0.
[target.'cfg(all(not(target_arch = "wasm32"), not(target_os = "macos")))'.dependencies]
interprocess = "2.4.7"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
console_log = "1.0"
wasm-bindgen-futures = "0.4.80"
web-sys = { version = "0.3.107", features = ["Window", "MediaQueryList", "Navigator", "Storage", "Document", "Element", "HtmlElement", "HtmlAnchorElement", "HtmlInputElement", "FileList", "File", "FileReader", "Blob", "BlobPropertyBag", "Url", "BeforeUnloadEvent", "Event", "EventTarget", "IdbFactory", "IdbOpenDbRequest", "IdbRequest", "IdbDatabase", "IdbTransaction", "IdbTransactionMode", "IdbObjectStore", "DragEvent", "DataTransfer"] }
js-sys = "0.3.107"
wasm-bindgen = "0.2.130"

# The system clipboard, for copy and paste between windows (text only).
# Not on Windows: its backend there is BSL-1.0 (clipboard.rs does it).
[target.'cfg(all(not(target_arch = "wasm32"), not(windows)))'.dependencies]
arboard = { version = "3.4", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSAccessibility", "NSWorkspace"] }
# Double-clicked files arrive as an Apple event winit does not pass on.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSURL", "NSString"] }
