name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    name: Windows zip
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release -p prism-app
      - name: Zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out/Prism | Out-Null
          Copy-Item target/release/prism-app.exe out/Prism/Prism.exe
          Compress-Archive -Path out/Prism -DestinationPath "Prism-${{ github.ref_name }}-windows-x64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: Prism-*.zip

  macos:
    name: macOS app (universal, ad-hoc signed)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - run: cargo build --release -p prism-app --target aarch64-apple-darwin
      - run: cargo build --release -p prism-app --target x86_64-apple-darwin
      - name: Make Prism.app and zip it
        run: |
          packaging/macos/make-app.sh "${GITHUB_REF_NAME#v}" "Prism-${GITHUB_REF_NAME}-macos-universal.zip" \
            target/aarch64-apple-darwin/release/prism-app \
            target/x86_64-apple-darwin/release/prism-app
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: Prism-*.zip

  publish:
    name: Publish the release
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Create the release and attach the zips
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/*.zip \
            --repo "$GITHUB_REPOSITORY" \
            --title "Prism $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md
