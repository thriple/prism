[workspace]
resolver = "3"
members = [
    "crates/prism-math",
    "crates/prism-geom",
    "crates/prism-topo",
    "crates/prism-ops",
    "crates/prism-doc",
    "crates/prism-render",
    "crates/prism-ui",
    "crates/prism-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thriple/prism"
rust-version = "1.88"

[workspace.dependencies]
winit = "0.30.13"
wgpu = "30.0.1"
egui = { version = "0.37.0", default-features = false }
egui-wgpu = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false }
log = "0.4.35"
prism-ui = { path = "crates/prism-ui" }
prism-math = { path = "crates/prism-math" }
prism-geom = { path = "crates/prism-geom" }
prism-topo = { path = "crates/prism-topo" }
prism-ops = { path = "crates/prism-ops" }
prism-doc = { path = "crates/prism-doc" }
prism-render = { path = "crates/prism-render" }
glam = { version = "0.34.2", features = ["serde"] }
robust = "1.2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
proptest = "1.12.0"

[profile.release]
# Smaller web build; native speed is unaffected in practice.
opt-level = 3
lto = "thin"
