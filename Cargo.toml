[workspace]
resolver = "3"
members = [
    "crates/prism-math",
    "crates/prism-geom",
    "crates/prism-topo",
    "crates/prism-kernel",
    "crates/prism-ops",
    "crates/prism-doc",
    "crates/prism-file",
    "crates/prism-view",
    "crates/prism-infer",
    "crates/prism-tools",
    "crates/prism-render",
    "crates/prism-ui",
    "crates/prism-app",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/thriple/prism"
rust-version = "1.88"

[workspace.dependencies]
winit = "0.30.13"
wgpu = "30.0.1"
egui = { version = "0.37.0", default-features = false }
egui-wgpu = "0.37.0"
egui-winit = { version = "0.37.0", default-features = false }
log = "0.4.35"
prism-ui = { path = "crates/prism-ui" }
prism-math = { path = "crates/prism-math" }
prism-geom = { path = "crates/prism-geom" }
prism-topo = { path = "crates/prism-topo" }
prism-kernel = { path = "crates/prism-kernel" }
prism-ops = { path = "crates/prism-ops" }
prism-doc = { path = "crates/prism-doc" }
prism-file = { path = "crates/prism-file" }
prism-render = { path = "crates/prism-render" }
prism-view = { path = "crates/prism-view" }
prism-infer = { path = "crates/prism-infer" }
prism-tools = { path = "crates/prism-tools" }
glam = { version = "0.34.2", features = ["serde"] }
robust = "1.2.0"
serde = { version = "1.0", features = ["derive", "rc"] }
# float_roundtrip: f64 values come back from JSON bit for bit (without it,
# about 11% of coordinates come back one bit off; docs/research).
serde_json = { version = "1.0", features = ["float_roundtrip"] }
# The .prism container: deflate only, pure Rust (no zstd or bzip2, which are C).
zip = { version = "9.4", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
# 3MF's XML (we write 3MF ourselves, DECISIONS #25).
quick-xml = "0.42"
proptest = "1.12.0"
# Textures (Basic Materials part 2): PNG and JPEG only, pure Rust.
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"

[profile.release]
# Smaller web build; native speed is unaffected in practice.
opt-level = 3
lto = "thin"
